plugins {
    id 'idea'
    id 'jacoco'
    id 'org.jetbrains.intellij' version '1.3.1'
    id 'org.jetbrains.changelog' version '1.3.1'
    id 'org.jetbrains.grammarkit' version '2021.1.3'
    id 'org.jetbrains.kotlin.jvm' version '1.7.22'
    id 'com.github.johnrengelman.shadow' version '7.1.2'
}

apply plugin: 'org.jetbrains.changelog'

group 'software.amazon.smithy'
version '2.0.20'

repositories {
    mavenCentral()
}

sourceSets {
    main.java.srcDirs 'src/main/gen'
}

test.finalizedBy jacocoTestReport
jacocoTestReport {
    dependsOn test
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: ['**/psi/impl/**'])
        }))
    }
    doLast {
        println("Coverage Report: file://${reports.html.outputLocation.file("index.html").get()}")
    }
}

idea {
    module {
        generatedSourceDirs += file('src/main/gen')
    }
}

// Jackson is no longer provided by the IDE (2026.3 moved Jackson 2 out of the core classpath), so it is bundled into
// the plugin jar and relocated to avoid clashing with whatever version the IDE ships.
configurations {
    shaded
    compileOnly.extendsFrom shaded
    testImplementation.extendsFrom shaded
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib'
    shaded 'com.fasterxml.jackson.core:jackson-databind:2.17.1'
    shaded('com.fasterxml.jackson.module:jackson-module-kotlin:2.17.1') {
        // Kotlin is provided by the IDE
        exclude group: 'org.jetbrains.kotlin'
    }
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'software.amazon.smithy:smithy-model:1.49.0'
    //Required by the IntelliJ platform test harness (BasePlatformTestCase) at runtime
    testRuntimeOnly 'org.jetbrains.kotlin:kotlin-stdlib-jdk8'
}

intellij {
    version = '2021.3.2'
    updateSinceUntilBuild = false
}

jar {
    archiveClassifier = 'thin'
}

shadowJar {
    archiveClassifier = ''
    configurations = [project.configurations.shaded]
    relocate 'com.fasterxml.jackson', 'software.amazon.smithy.intellij.shaded.jackson'
    // Drop multi-release variants (unreadable by this shadow version) and module descriptors
    exclude 'module-info.class', 'META-INF/versions/**'
    mergeServiceFiles()
}

prepareSandbox {
    pluginJar = shadowJar.archiveFile
    dependsOn shadowJar
}

patchPluginXml {
    sinceBuild = '213'
    changeNotes = provider { changelog.getLatest().toHTML() }
}


import org.jetbrains.grammarkit.tasks.GenerateLexer
import org.jetbrains.grammarkit.tasks.GenerateParser

task generateSmithyLexer(type: GenerateLexer) {
    source 'src/main/grammar/Smithy.flex'
    targetDir 'src/main/gen/software/amazon/smithy/intellij/'
    targetClass '_SmithyLexer'
    purgeOldFiles true
    outputs.upToDateWhen { false }
}

task generateSmithyParser(type: GenerateParser, dependsOn: generateSmithyLexer) {
    source 'src/main/grammar/Smithy.bnf'
    targetRoot 'src/main/gen/'
    pathToParser 'SmithyParser'
    pathToPsiRoot 'psi/'
    purgeOldFiles true
    outputs.upToDateWhen { false }
}

compileKotlin {
    dependsOn generateSmithyParser
    kotlinOptions.freeCompilerArgs += ["-Xjvm-default=all-compatibility"]
}
