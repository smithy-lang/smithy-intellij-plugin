plugins {
    id 'idea'
    id 'jacoco'
    id 'org.jetbrains.intellij' version '1.17.4'
    id 'org.jetbrains.changelog' version '2.2.1'
    id 'org.jetbrains.grammarkit' version '2021.2.2'
    id 'org.jetbrains.kotlin.jvm' version '1.9.25'
}

apply plugin: 'org.jetbrains.changelog'

group 'software.amazon.smithy'
version '2.0.19'

repositories {
    mavenCentral()
}

sourceSets {
    main.java.srcDirs 'src/main/gen'
}

test.finalizedBy jacocoTestReport
jacocoTestReport {
    dependsOn test
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: ['**/psi/impl/**'])
        }))
    }
    doLast {
        println("Coverage Report: file://${reports.html.outputLocation.file("index.html").get()}")
    }
}

idea {
    module {
        generatedSourceDirs += file('src/main/gen')
    }
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.1'
    implementation 'com.fasterxml.jackson.module:jackson-module-kotlin:2.17.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'software.amazon.smithy:smithy-model:1.49.0'
}

tasks.withType(JavaCompile).configureEach {
    sourceCompatibility = '11'
    targetCompatibility = '11'
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = '11'
    }
}

intellij {
    version = '2021.3.2'
    updateSinceUntilBuild = false
    plugins = ['java']
}

patchPluginXml {
    sinceBuild = '213'
    changeNotes = provider {
        changelog.renderItem(changelog.getLatest(), org.jetbrains.changelog.Changelog.OutputType.HTML)
    }
}


import org.jetbrains.grammarkit.tasks.GenerateLexerTask
import org.jetbrains.grammarkit.tasks.GenerateParserTask

tasks.register('generateSmithyLexer', GenerateLexerTask) {
    source.set('src/main/grammar/Smithy.flex')
    targetDir.set('src/main/gen/software/amazon/smithy/intellij/')
    targetClass.set('_SmithyLexer')
    purgeOldFiles.set(true)
    outputs.upToDateWhen { false }
}

tasks.register('generateSmithyParser', GenerateParserTask) {
    dependsOn('generateSmithyLexer')
    source.set('src/main/grammar/Smithy.bnf')
    targetRoot.set('src/main/gen/')
    pathToParser.set('SmithyParser')
    pathToPsiRoot.set('psi/')
    purgeOldFiles.set(true)
    outputs.upToDateWhen { false }
}

compileKotlin {
    dependsOn generateSmithyParser
    kotlinOptions.freeCompilerArgs += ["-Xjvm-default=all-compatibility"]
}
